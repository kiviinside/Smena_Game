# Локальный запуск: docker compose up --build
# Игра + API будут на http://localhost:8080
# PostgreSQL доступен для pgAdmin на localhost:5433 (БД smena, пользователь smena).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smena
      POSTGRES_USER: smena
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - smena-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smena -d smena"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smena
      DB_USER: smena
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "8080:8080"

volumes:
  smena-db:
