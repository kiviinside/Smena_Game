server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://smena-backend.mlp.blitz.cloud;
        proxy_ssl_server_name on;
        proxy_set_header Host smena-backend.mlp.blitz.cloud;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}